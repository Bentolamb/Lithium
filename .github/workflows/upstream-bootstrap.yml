name: Lithium upstream bootstrap and native tests

on:
  workflow_dispatch:
  push:
    branches:
      - dev/turbowarp-wasm-rebase
    paths:
      - '.github/workflows/upstream-bootstrap.yml'
      - 'tools/bootstrap_turbowarp.sh'
      - 'tools/audit_turbowarp.mjs'
      - 'tests/audit_turbowarp.test.mjs'
      - 'CMakeLists.txt'
      - 'runtime/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  upstream-audit:
    name: Clone and audit official TurboWarp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lithium
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit tooling
        run: node --test tests/audit_turbowarp.test.mjs
      - name: Clone official TurboWarp repositories
        run: bash tools/bootstrap_turbowarp.sh
      - name: Inspect pinned revisions and dependencies
        run: node tools/audit_turbowarp.mjs .upstream-turbowarp
      - name: Upload upstream provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-upstream-audit
          path: |
            .upstream-turbowarp/UPSTREAM_COMMITS.txt
            .upstream-turbowarp/UPSTREAM_AUDIT.json
          if-no-files-found: warn

  native-runtime:
    name: Build and test existing Lithium C++ runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lithium
        uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Run native tests
        run: ctest --test-dir build --output-on-failure
