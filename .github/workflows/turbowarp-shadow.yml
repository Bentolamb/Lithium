name: TurboWarp + Lithium shadow integration

on:
  workflow_dispatch:
  push:
    branches:
      - dev/turbowarp-wasm-rebase
    paths:
      - '.github/workflows/turbowarp-shadow.yml'
      - 'integration/**'
      - 'runtime/**'
      - 'CMakeLists.txt'
      - 'third_party/**'
      - 'tests/wasm_smoke.js'
      - 'tests/**'

permissions:
  contents: read

jobs:
  editor-with-shadow-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.12'
      - name: Install Ninja and ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip
      - name: Validate integration JavaScript syntax
        run: |
          node --check integration/shadow.js
          node --check integration/compare.js
          node --check integration/panel.js
          node --check integration/inject_shadow.mjs
          node --check integration/verify_bundle.mjs
      - name: Run integration regression tests
        run: node --test tests/inject_shadow.test.mjs tests/compare_shadow.test.cjs tests/bridge_shadow.test.cjs tests/verify_bundle.test.mjs
      - name: Build native Lithium to WebAssembly
        run: |
          emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DLITHIUM_BUILD_TESTS=OFF
          cmake --build build-wasm --parallel 2
          node tests/wasm_smoke.js build-wasm/lithium_wasm.js
      - name: Clone original TurboWarp editor
        run: git clone --depth 1 https://github.com/TurboWarp/scratch-gui.git /tmp/turbowarp-gui
      - name: Record upstream revision
        run: git -C /tmp/turbowarp-gui rev-parse HEAD | tee turbowarp-source-sha.txt
      - name: Install GUI dependencies
        working-directory: /tmp/turbowarp-gui
        run: npm ci --no-audit --no-fund
      - name: Build TurboWarp GUI without modifying its VM
        working-directory: /tmp/turbowarp-gui
        run: npm run build
      - name: Add shadow diagnostic bridge
        run: |
          mkdir -p /tmp/turbowarp-gui/build/lithium
          cp build-wasm/lithium_wasm.js build-wasm/lithium_wasm.wasm /tmp/turbowarp-gui/build/lithium/
          cp integration/shadow.js integration/compare.js integration/panel.js /tmp/turbowarp-gui/build/lithium/
          node integration/inject_shadow.mjs /tmp/turbowarp-gui/build
      - name: Verify complete browser bundle
        run: node integration/verify_bundle.mjs /tmp/turbowarp-gui/build
      - name: Install Playwright Chromium for browser smoke test
        run: |
          npm install --prefix /tmp/lithium-playwright --no-save --no-package-lock playwright@1.56.1
          /tmp/lithium-playwright/node_modules/.bin/playwright install chromium --with-deps
      - name: Smoke-test full editor in Chromium
        env:
          NODE_PATH: /tmp/lithium-playwright/node_modules
        run: node tests/browser_shadow_smoke.cjs /tmp/turbowarp-gui/build
      - name: Upload browser smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lithium-shadow-browser-screenshot
          path: lithium-browser-smoke.png
          if-no-files-found: warn
          retention-days: 14
      - name: Package combined editor
        run: |
          cd /tmp/turbowarp-gui/build
          zip -qr "$GITHUB_WORKSPACE/turbowarp-lithium-shadow.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: turbowarp-lithium-shadow-editor
          path: |
            turbowarp-lithium-shadow.zip
            turbowarp-source-sha.txt
          if-no-files-found: error
          retention-days: 14
