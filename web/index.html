<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lithium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <strong class="brand">Lithium</strong>
  <button id="open" title="Open an .sb3 project">Open…</button>
  <select id="demo" title="Built-in demo projects">
    <option value="">Demos</option>
    <option value="slide">slide</option>
    <option value="repeat_counter">repeat_counter</option>
    <option value="wait">wait</option>
    <option value="forever_counter">forever_counter</option>
  </select>
  <span class="sep"></span>
  <button id="flag" class="flag" disabled title="Green flag">&#9873; Go</button>
  <button id="stop" class="stop" disabled title="Stop all">&#9632; Stop</button>
  <label><input type="checkbox" id="turbo"> Turbo</label>
  <label><input type="checkbox" id="compat"> 30 fps</label>
  <span id="status" class="status">loading runtime…</span>
  <input type="file" id="file" accept=".sb3" hidden>
</header>
<main id="drop">
  <section class="stage-wrap">
    <canvas id="stage" width="480" height="360"></canvas>
    <p class="hint" id="hint">Drop an .sb3 here, or choose a demo.</p>
  </section>
  <aside>
    <h2>Variables</h2>
    <table id="vars"><tbody></tbody></table>
    <h2>Sprites</h2>
    <table id="sprites"><thead><tr><th>name</th><th>x</th><th>y</th><th>dir</th></tr></thead><tbody></tbody></table>
    <h2>Load log</h2>
    <pre id="log">–</pre>
  </aside>
</main>
<script src="vendor/scratch-render.js"></script>
<script src="../build-wasm/lithium_wasm.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
